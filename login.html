<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Bibliothèque Numérique</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            <img src="images/logo biblio.jfif" alt="" width="50" height="50">
         My Library
        </div>

        <nav>

            <a href="index.html">Accueil</a>
            <a href="login.html">Connexion</a>
            <a href="register.html">Inscription</a>
             <a href="Apropos.html">À propos</a>


        </nav>

    </header>

    <!-- Formulaire -->

    <main class="login-section">

        <div class="login-card">

            <h2>Connexion</h2>

            <p>Connectez-vous à votre compte</p>

            <form action="#" method="POST">

                <div class="input-box">

                    <label>Email</label>

                    <input type="email"
                        placeholder="Entrez votre adresse email"
                        required>

                </div>

                <div class="input-box">

                    <label for="password">Mot de passe</label>

                    <div class="password-wrapper">
                        <input type="password"
                            id="password"
                            placeholder="Entrez votre mot de passe"
                            required>
                        <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>

                </div>

                <button type="submit" class="login-btn">

                    Se connecter

                </button>

            </form>

            <p class="register-link">

                Vous n'avez pas de compte ?

                <a href="register.html">Créer un compte</a>

            </p>

        </div>

    </main>

    <!-- Footer -->

    <footer>
        <div class="footer-brand">
            <div class="footer-logo-circle">
                <img src="images/logo biblio.jfif" alt="Logo My Library">
            </div>
            <span>2026 My Library</span>
        </div>
    </footer>

    <script>
    

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePassword.innerHTML = isPassword
                    ? '<i class="fa-solid fa-eye-slash"></i>'
                    : '<i class="fa-solid fa-eye"></i>';
                togglePassword.setAttribute(
                    'aria-label',
                    isPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
                );
            });
        }
    </script>

    <script src="theme.js"></script>

</body>

</html>
