<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Utilisateurs</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
<header>
    <div class="logo">
        <img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="" width="50" height="50">
        My Library
    </div>
    <nav>
        <a href="{{ url_for('home') }}">Accueil</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Déconnexion</a>
    </nav>
</header>

<main style="padding:40px;">
    <div style="max-width:1000px;margin:0 auto;background:white;padding:24px;border-radius:12px;">
        <h1>Gestion des utilisateurs</h1>
        <table style="width:100%;border-collapse:collapse;margin-top:20px;">
            <thead>
                <tr style="background:#1f4e79;color:white;">
                    <th style="padding:12px 8px;text-align:left;">ID</th>
                    <th style="padding:12px 8px;text-align:left;">Nom</th>
                    <th style="padding:12px 8px;text-align:left;">Email</th>
                    <th style="padding:12px 8px;text-align:left;">Rôle</th>
                    <th style="padding:12px 8px;text-align:left;">Inscrit le</th>
                    <th style="padding:12px 8px;text-align:left;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for u in users %}
                <tr style="border-bottom:1px solid #eee;">
                    <td style="padding:10px;">{{ u.id }}</td>
                    <td style="padding:10px;">{{ u.fullname }}</td>
                    <td style="padding:10px;">{{ u.email }}</td>
                    <td style="padding:10px;">{{ u.role or 'user' }}</td>
                    <td style="padding:10px;">{{ u.created_at }}</td>
                    <td style="padding:10px;">
                        <form action="{{ url_for('admin_promote', user_id=u.id) }}" method="POST" style="display:inline-block;margin-right:8px;">
                            {% if u.role == 'admin' %}
                            <input type="hidden" name="action" value="demote">
                            <button class="view-more-btn" style="background:#d9534f;">Rétrograder</button>
                            {% else %}
                            <input type="hidden" name="action" value="promote">
                            <button class="view-more-btn">Promouvoir</button>
                            {% endif %}
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</main>

<footer style="margin-top:40px;">
    <div class="footer-brand">
        <div class="footer-logo-circle">
            <img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="Logo My Library">
        </div>
        <span>2026 My Library</span>
    </div>
</footer>
</body>
</html>
