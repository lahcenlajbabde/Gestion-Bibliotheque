<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Bibliothèque Numérique</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            <img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="" width="50" height="50">
         My Library
        </div>

        <nav>

            <a href="{{ url_for('home') }}"><i class="fa-solid fa-house"></i> Accueil</a>
            <a href="{{ url_for('login') }}"><i class="fa-solid fa-right-to-bracket"></i> Connexion</a>
            <a href="{{ url_for('register') }}"><i class="fa-solid fa-user-plus"></i> Inscription</a>
            <a href="{{ url_for('apropos') }}"><i class="fa-solid fa-circle-info"></i> À propos</a>

        </nav>

    </header>

    <!-- Formulaire -->

    <main class="login-section">

        <div class="login-card">

            <h2>Connexion</h2>

            <p>Connectez-vous à votre compte</p>

            {% if message %}
            <p class="message">{{ message }}</p>
            {% endif %}

            <form action="{{ url_for('login') }}" method="POST">

                <div class="input-box">

                    <label>Email</label>

                    <input type="email" name="email"
                        placeholder="Entrez votre adresse email"
                        required>

                </div>

                <div class="input-box">

                    <label for="password">Mot de passe</label>

                    <div class="password-wrapper">
                        <input type="password"
                            id="password" name="password"
                            placeholder="Entrez votre mot de passe"
                            required>
                        <button type="button" class="toggle-password" aria-label="Afficher le mot de passe">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>

                </div>

                <button type="submit" class="login-btn">

                    Se connecter

                </button>

            </form>

            <p class="register-link">

                Vous n'avez pas de compte ?

                <a href="{{ url_for('register') }}">Créer un compte</a>

            </p>

        </div>

    </main>

    <!-- Footer -->

    <footer>
        <div class="footer-brand">
            <div class="footer-logo-circle">
                <img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="Logo My Library">
            </div>
            <span>2026 My Library</span>
        </div>
    </footer>

    <script>
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#password');

        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePassword.innerHTML = isPassword
                    ? '<i class="fa-solid fa-eye-slash"></i>'
                    : '<i class="fa-solid fa-eye"></i>';
                togglePassword.setAttribute(
                    'aria-label',
                    isPassword ? 'Masquer le mot de passe' : 'Afficher le mot de passe'
                );
            });
        }
    </script>

    <script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>

</html>
