<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ doc.title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
<header>
    <div class="logo"><img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="" width="50" height="50"> My Library</div>
    <nav>
        <a href="{{ url_for('home') }}">Accueil</a>
        <a href="{{ url_for('logout') }}">Déconnexion</a>
    </nav>
</header>
<main style="padding:40px;">
    <div style="max-width:900px;margin:0 auto;background:white;padding:24px;border-radius:12px;">
        <div style="display:flex;gap:24px;align-items:flex-start;">
            <div style="flex:0 0 260px;">
                {% if doc.cover_image %}
                <img src="{{ url_for('static', filename='images/covers/' + doc.cover_image) }}" alt="Couverture {{ doc.title }}" style="width:100%;height:auto;border-radius:8px;box-shadow:0 10px 20px rgba(0,0,0,.08);">
                {% else %}
                <div style="width:100%;height:360px;background:#f4f6f9;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;">Pas de couverture</div>
                {% endif %}
            </div>
            <div style="flex:1;">
                <h1>{{ doc.title }}</h1>
                <p><strong>Auteur:</strong> {{ doc.author }}</p>
                {% if doc.category %}
                <p><strong>Catégorie:</strong> {{ doc.category }}</p>
                {% endif %}
                {% if doc.summary %}
                <div style="margin-top:18px;">
                    <h3 style="color:#1f4e79;margin-bottom:8px;">Résumé</h3>
                    <p style="color:#333;line-height:1.6;">{{ doc.summary }}</p>
                </div>
                {% endif %}
                <div style="margin-top:18px;">
                    <a href="{{ url_for('uploaded_pdf', filename=doc.filename) }}" class="view-more-btn" target="_blank">Télécharger le PDF</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
