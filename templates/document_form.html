<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% if action=='create' %}Ajouter{% else %}Modifier{% endif %} document</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
<header>
    <div class="logo"><img src='{{ url_for("static", filename="images/logo biblio.jfif") }}' alt="" width="50" height="50"> My Library</div>
    <nav>
        <a href="{{ url_for('dashboard_admin') }}">Dashboard</a>
        <a href="{{ url_for('admin_documents') }}">Documents</a>
        <a href="{{ url_for('logout') }}">Déconnexion</a>
    </nav>
</header>
<main style="padding:40px;">
    <div style="max-width:700px;margin:0 auto;background:white;padding:24px;border-radius:12px;">
        <h1>{% if action=='create' %}Ajouter{% else %}Modifier{% endif %} un document</h1>
        {% if message %}<div class="alert-box">{{ message }}</div>{% endif %}
        <form method="POST" enctype="multipart/form-data">
            <div class="input-group">
                <label for="title">Titre</label>
                <input type="text" id="title" name="title" value="{{ doc.title if doc else '' }}" required>
            </div>
            <div class="input-group">
                <label for="author">Auteur</label>
                <input type="text" id="author" name="author" value="{{ doc.author if doc else '' }}">
            </div>
            <div class="input-group">
                <label for="category">Catégorie</label>
                <input type="text" id="category" name="category" value="{{ doc.category if doc else '' }}" placeholder="Ex: Science, Histoire, Littérature...">
            </div>
            <div class="input-group">
                <label for="summary">Résumé du document</label>
                <textarea id="summary" name="summary" rows="5" placeholder="Écrivez un résumé du document...">{{ doc.summary if doc else '' }}</textarea>
            </div>
            <div class="input-group">
                <label for="pdf_file">Fichier PDF {{ '(laisser vide pour garder le fichier actuel)' if action=='edit' else '' }}</label>
                <input type="file" id="pdf_file" name="pdf_file" accept="application/pdf" {{ 'required' if action=='create' else '' }}>
            </div>
            <div class="input-group">
                <label for="cover_file">Image de couverture (optionnel)</label>
                <input type="file" id="cover_file" name="cover_file" accept="image/*">
            </div>
            <button class="save-btn" type="submit">Enregistrer</button>
        </form>
    </div>
</main>
</body>
</html>
